<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyBanque - Votre plateforme de gestion bancaire en ligne sécurisée et moderne" />
    <meta name="theme-color" content="#4F46E5" />
    
    <!-- SEO & Meta Tags -->
    <meta name="keywords" content="banque en ligne, gestion financière, compte bancaire, transactions, FCFA" />
    <meta name="author" content="MyBanque" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mybanque.com/" />
    <meta property="og:title" content="MyBanque - Gestion Bancaire Moderne" />
    <meta property="og:description" content="Gérez vos comptes, effectuez des transactions et suivez votre historique en toute sécurité" />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyBanque - Gestion Bancaire" />
    <meta name="twitter:description" content="Votre plateforme bancaire sécurisée" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect pour performances -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <title>MyBanque - Gestion Bancaire Moderne</title>
    
    <style>
      /* === RESET & BASE === */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #4F46E5;
        --primary-dark: #4338CA;
        --secondary: #10B981;
        --background: #F9FAFB;
        --surface: #FFFFFF;
        --error: #EF4444;
        --text-primary: #111827;
        --text-secondary: #6B7280;
        --border: #E5E7EB;
        --shadow: rgba(0, 0, 0, 0.1);
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: var(--background);
        color: var(--text-primary);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* === LOADING SCREEN === */
      #root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .app-loader {
        text-align: center;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        max-width: 400px;
        width: 90%;
      }

      .loader-logo {
        font-size: 64px;
        margin-bottom: 20px;
        animation: bounce 2s ease-in-out infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }

      .loader-text {
        font-size: 14px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .loader-progress {
        width: 100%;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        margin-top: 20px;
        overflow: hidden;
      }

      .loader-progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        border-radius: 2px;
        animation: progress 2s ease-in-out infinite;
      }

      @keyframes progress {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }

      /* === NOSCRIPT WARNING === */
      .noscript-warning {
        display: block;
        text-align: center;
        padding: 60px 30px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: 0 10px 40px var(--shadow);
        max-width: 600px;
        margin: 0 auto;
      }

      .noscript-warning-icon {
        font-size: 72px;
        margin-bottom: 20px;
      }

      .noscript-warning h1 {
        color: var(--error);
        margin-bottom: 15px;
        font-size: 28px;
        font-weight: 700;
      }

      .noscript-warning p {
        color: var(--text-secondary);
        line-height: 1.8;
        font-size: 16px;
        margin-bottom: 15px;
      }

      .noscript-warning-steps {
        background: var(--background);
        padding: 20px;
        border-radius: 12px;
        margin-top: 20px;
        text-align: left;
      }

      .noscript-warning-steps ol {
        padding-left: 20px;
      }

      .noscript-warning-steps li {
        margin: 10px 0;
        color: var(--text-primary);
      }

      /* === RESPONSIVE === */
      @media (max-width: 640px) {
        .app-loader {
          padding: 30px 20px;
        }

        .loader-logo {
          font-size: 48px;
        }

        .loader-title {
          font-size: 20px;
        }

        .noscript-warning {
          padding: 40px 20px;
        }

        .noscript-warning h1 {
          font-size: 24px;
        }
      }

      /* === ACCESSIBILITY === */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #111827;
          --surface: #1F2937;
          --text-primary: #F9FAFB;
          --text-secondary: #9CA3AF;
          --border: #374151;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <!-- Message pour navigateurs sans JavaScript -->
    <noscript>
      <div class="noscript-warning">
        <div class="noscript-warning-icon">⚠️</div>
        <h1>JavaScript est requis</h1>
        <p>
          MyBanque nécessite JavaScript pour fonctionner correctement.<br />
          Veuillez activer JavaScript dans les paramètres de votre navigateur.
        </p>
        <div class="noscript-warning-steps">
          <strong>Comment activer JavaScript :</strong>
          <ol>
            <li>Ouvrez les paramètres de votre navigateur</li>
            <li>Recherchez "JavaScript" ou "Contenu"</li>
            <li>Activez l'option JavaScript</li>
            <li>Rechargez cette page</li>
          </ol>
        </div>
      </div>
    </noscript>

    <!-- Point de montage React -->
    <div id="root">
      <!-- Écran de chargement visible avant React -->
      <div class="app-loader">
        <div class="loader-logo">🏦</div>
        <div class="loader-spinner"></div>
        <h1 class="loader-title">MyBanque</h1>
        <p class="loader-text">Chargement de votre espace bancaire...</p>
        <div class="loader-progress">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Script principal React (Module ES6) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
